[project]
name = "virtual-literature-companion"
version = "0.1.0"
description = "Advanced PDF book processing and analysis system with AI-powered literary analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.9.0",
    "anthropic>=0.57.1",
    "beautifulsoup4>=4.13.4",
    "chromadb>=1.0.15",
    "click>=8.2.1",
    "datasets>=4.0.0",
    "ebooklib>=0.19",
    "huggingface-hub[cli]>=0.33.2",
    "llama-cpp-python>=0.3.13",
    "lxml>=6.0.0",
    "openai>=1.93.3",
    "pdfplumber>=0.11.7",
    "pillow>=11.3.0",
    "pymupdf>=1.24.14",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "sentence-transformers>=5.0.0",
    "streamlit>=1.46.1",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "transformers[torch]>=4.53.1",
    "watchdog>=6.0.0",
]

[project.scripts]
vlc = "virtual_literature_companion.cli:cli"
